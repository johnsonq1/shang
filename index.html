<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
      background: transparent;
    }

    .carousel {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #111;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      z-index: 1;
      pointer-events: auto;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .caption {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      padding: 80px 45px 30px;
      color: white;
      background: linear-gradient(
        transparent,
        rgba(0, 0, 0, 0.9)
      );
    }

    .caption h2 {
      margin: 0;
      font-family: 'Merriweather', serif;
      font-size: 36px;
      font-weight: 700;
    }

    .see-more {
      display: inline-block;
      margin-top: 12px;
      padding: 9px 16px;
      border: 1px solid white;
      color: white;
      font-family: 'Merriweather', serif;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .see-more:hover {
      background: white;
      color: black;
    }

    .prev,
    .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      border: none;
      background: rgba(0, 0, 0, 0.4);
      color: white;
      font-size: 40px;
      padding: 8px 15px;
      cursor: pointer;
    }

    .prev {
      left: 15px;
    }

    .next {
      right: 15px;
    }

    .prev:hover,
    .next:hover {
      background: rgba(0, 0, 0, 0.7);
    }

    .dots {
      position: absolute;
      z-index: 10;
      right: 25px;
      bottom: 18px;
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
    }

    .dot.active {
      background: white;
    }
  </style>
</head>

<body>

  <div class="carousel">

    <div class="slide active">
      <img
        src="https://lh3.googleusercontent.com/d/15pcICebky2wS1FK6vGSH24gPOoIDb8sj"
        alt="Technology and Architecture"
      >

      <div class="caption">
        <h2>Technology &amp; Architecture</h2>
        <a
          class="see-more"
          href="https://sites.google.com/k12.xrds.org/shangdynasty1/technology-and-architecture?authuser=1"
          target="_blank"
          rel="noopener noreferrer"
        >
          See More →
        </a>
      </div>
    </div>


    <div class="slide">
      <img
        src="https://lh3.googleusercontent.com/d/1dhTvMFphgFCJRbScefAnKy5nmKU87oXC"
        alt="Political System and Government"
      >

      <div class="caption">
        <h2>Political System &amp; Government</h2>
        <a
          class="see-more"
          href="https://sites.google.com/k12.xrds.org/shangdynasty1/political-system-and-government?authuser=1"
          target="_blank"
          rel="noopener noreferrer"
        >
          See More →
        </a>
      </div>
    </div>


    <div class="slide">
      <img
        src="https://lh3.googleusercontent.com/d/1EsVb0il-cd7ISMuxPff_HEumurfkhy8x"
        alt="Religion"
      >

      <div class="caption">
        <h2>Religion</h2>
        <a
          class="see-more"
          href="https://sites.google.com/k12.xrds.org/shangdynasty1/religion?authuser=1"
          target="_blank"
          rel="noopener noreferrer"
        >
          See More →
        </a>
      </div>
    </div>


    <div class="slide">
      <img
        src="https://lh3.googleusercontent.com/d/1Se_-ZA6EUaRMO3ZSXVv7Ry-rE47DeB5_"
        alt="Geography"
      >

      <div class="caption">
        <h2>Geography</h2>
        <a
          class="see-more"
          href="https://sites.google.com/k12.xrds.org/shangdynasty1/geography?authuser=1"
          target="_blank"
          rel="noopener noreferrer"
        >
          See More →
        </a>
      </div>
    </div>


    <button class="prev" type="button" aria-label="Previous slide">‹</button>
    <button class="next" type="button" aria-label="Next slide">›</button>

    <div class="dots"></div>

  </div>


  <script>
    const slides = document.querySelectorAll(".slide");
    const dotsContainer = document.querySelector(".dots");
    const nextButton = document.querySelector(".next");
    const prevButton = document.querySelector(".prev");

    let current = 0;
    let timer;

    slides.forEach((slide, index) => {
      const dot = document.createElement("div");

      dot.classList.add("dot");

      dot.addEventListener("click", () => {
        showSlide(index);
        restartTimer();
      });

      dotsContainer.appendChild(dot);
    });

    const dots = document.querySelectorAll(".dot");

    function showSlide(index) {
      slides[current].classList.remove("active");
      dots[current].classList.remove("active");

      current = (index + slides.length) % slides.length;

      slides[current].classList.add("active");
      dots[current].classList.add("active");
    }

    function nextSlide() {
      showSlide(current + 1);
    }

    function restartTimer() {
      clearInterval(timer);
      timer = setInterval(nextSlide, 3000);
    }

    nextButton.addEventListener("click", () => {
      nextSlide();
      restartTimer();
    });

    prevButton.addEventListener("click", () => {
      showSlide(current - 1);
      restartTimer();
    });

    dots[0].classList.add("active");

    timer = setInterval(nextSlide, 3000);
  </script>

</body>
</html>
