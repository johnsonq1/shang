<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Merriweather -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: hidden;
      background: transparent;
    }

    .carousel {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #111;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      z-index: 1;
      pointer-events: auto;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.75) 0%,
        rgba(0, 0, 0, 0.25) 45%,
        rgba(0, 0, 0, 0) 70%
      );
    }

    .content {
      position: absolute;
      left: 7%;
      bottom: 10%;
      color: white;
      font-family: "Merriweather", serif;
      z-index: 2;
    }

    .content h2 {
      margin: 0 0 14px;
      font-family: "Merriweather", serif;
      font-size: clamp(22px, 4vw, 52px);
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
    }

    .see-more {
      display: inline-block;
      color: white;
      font-family: "Merriweather", serif;
      font-size: clamp(12px, 1.5vw, 18px);
      font-weight: 700;
      text-decoration: none;
      border-bottom: 2px solid white;
      padding-bottom: 4px;
      transition: opacity 0.2s ease;
    }

    .see-more:hover {
      opacity: 0.7;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;

      width: 46px;
      height: 46px;
      border: none;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.45);
      color: white;

      font-size: 28px;
      cursor: pointer;
    }

    .arrow:hover {
      background: rgba(0, 0, 0, 0.7);
    }

    .prev {
      left: 18px;
    }

    .next {
      right: 18px;
    }

    .dots {
      position: absolute;
      bottom: 4%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;

      display: flex;
      gap: 9px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      cursor: pointer;
    }

    .dot.active {
      background: white;
    }
  </style>
</head>

<body>

  <div class="carousel">

    <!-- TECHNOLOGY & ARCHITECTURE -->
    <div class="slide active">
      <img src="IMAGE1.jpg" alt="Technology and Architecture">

      <div class="overlay"></div>

      <div class="content">
        <h2>Technology & Architecture</h2>

        <a
          class="see-more"
          href="https://sites.google.com/k12.xrds.org/dynastyshang/technology-and-architecture"
          target="_top"
        >
          See More
        </a>
      </div>
    </div>


    <!-- POLITICAL SYSTEM -->
    <div class="slide">
      <img src="IMAGE2.jpg" alt="Political System and Government">

      <div class="overlay"></div>

      <div class="content">
        <h2>Political System & Government</h2>

        <a
          class="see-more"
          href="https://sites.google.com/k12.xrds.org/dynastyshang/political-system-and-government"
          target="_top"
        >
          See More
        </a>
      </div>
    </div>


    <!-- RELIGION -->
    <div class="slide">
      <img src="IMAGE3.jpg" alt="Religion">

      <div class="overlay"></div>

      <div class="content">
        <h2>Religion</h2>

        <a
          class="see-more"
          href="https://sites.google.com/k12.xrds.org/dynastyshang/religion"
          target="_top"
        >
          See More
        </a>
      </div>
    </div>


    <!-- GEOGRAPHY -->
    <div class="slide">
      <img src="IMAGE4.jpg" alt="Geography">

      <div class="overlay"></div>

      <div class="content">
        <h2>Geography</h2>

        <a
          class="see-more"
          href="https://sites.google.com/k12.xrds.org/dynastyshang/geography"
          target="_top"
        >
          See More
        </a>
      </div>
    </div>


    <!-- ARROWS -->
    <button class="arrow prev" onclick="changeSlide(-1)">‹</button>
    <button class="arrow next" onclick="changeSlide(1)">›</button>


    <!-- DOTS -->
    <div class="dots">
      <span class="dot active" onclick="goToSlide(0)"></span>
      <span class="dot" onclick="goToSlide(1)"></span>
      <span class="dot" onclick="goToSlide(2)"></span>
      <span class="dot" onclick="goToSlide(3)"></span>
    </div>

  </div>


  <script>
    const slides = document.querySelectorAll(".slide");
    const dots = document.querySelectorAll(".dot");

    let currentSlide = 0;
    let autoRotate;

    function showSlide(index) {
      slides.forEach(slide => slide.classList.remove("active"));
      dots.forEach(dot => dot.classList.remove("active"));

      currentSlide = (index + slides.length) % slides.length;

      slides[currentSlide].classList.add("active");
      dots[currentSlide].classList.add("active");
    }

    function changeSlide(direction) {
      showSlide(currentSlide + direction);
      restartAutoRotate();
    }

    function goToSlide(index) {
      showSlide(index);
      restartAutoRotate();
    }

    function startAutoRotate() {
      autoRotate = setInterval(() => {
        showSlide(currentSlide + 1);
      }, 5000);
    }

    function restartAutoRotate() {
      clearInterval(autoRotate);
      startAutoRotate();
    }

    startAutoRotate();
  </script>

</body>

</html>
